<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found - Will Tibo Reset</title>
    <script>
      // SPA fallback for GitHub Pages: redirect unknown paths back to /
      const segment = 1;
      const l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname +
        (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, segment + 1).join("/") +
        "/?" +
        l.pathname.slice(1).split("/").slice(segment).join("/").replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
      );
    </script>
  </head>
  <body>
    <p>Redirecting to Will Tibo Reset dashboard...</p>
  </body>
</html>
