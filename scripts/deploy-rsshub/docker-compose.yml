services:
  rsshub:
    image: diygod/rsshub:chromium-bundled
    container_name: rsshub
    restart: unless-stopped
    ports:
      - "1200:1200"
    environment:
      NODE_ENV: production
      CACHE_TYPE: memory
      # Twitter/X credentials - required for X feeds
      # Replace with your own Twitter/X cookie values
      # TWITTER_AUTH_TOKEN: "your_auth_token"
      # TWITTER_COOKIE: "auth_token=your_auth_token; ct0=your_ct0"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:1200"]
      interval: 30s
      timeout: 10s
      retries: 3
