name: WillTiboReset Prediction

on:
  workflow_dispatch:
  schedule:
    # Run every hour at the top of the hour
    - cron: '0 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# Prevent overlapping runs when a manual dispatch happens close to a scheduled run.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest

    steps:
      - name: Print trigger info
        run: |
          echo "Triggered by: ${{ github.event_name }}"
          echo "Run at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

      - name: Checkout repository
        uses: actions/checkout@v6

      # Runtime JSON is published with the Pages artifact so the prediction
      # history survives without adding generated commits to the source repo.
      - name: Restore last deployed runtime state
        run: |
          set -euo pipefail
          site_url="https://$(tr -d '\r\n' < CNAME)"

          for file in model_state.json prediction_history.json reset_history.json uncertain_events.json tweets.json; do
            destination="data/$file"
            temporary_file="$(mktemp)"
            if curl --fail --silent --show-error --location --retry 3 --max-time 30 \
              "$site_url/data/$file" -o "$temporary_file" \
              && python3 -m json.tool "$temporary_file" >/dev/null 2>&1; then
              mv "$temporary_file" "$destination"
              echo "Restored $destination from deployed state"
            else
              rm -f "$temporary_file"
              echo "Using repository seed for $destination"
            fi
          done

          for file in prediction.json model_performance.json; do
            destination="output/$file"
            temporary_file="$(mktemp)"
            if curl --fail --silent --show-error --location --retry 3 --max-time 30 \
              "$site_url/data/$file" -o "$temporary_file" \
              && python3 -m json.tool "$temporary_file" >/dev/null 2>&1; then
              mv "$temporary_file" "$destination"
              echo "Restored $destination from deployed state"
            else
              rm -f "$temporary_file"
              echo "Using repository seed for $destination"
            fi
          done

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update model state
        run: python update_model.py

      - name: Run prediction
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          TIBO_RSS_URLS: ${{ secrets.TIBO_RSS_URLS }}
          OPENAI_RSS_URLS: ${{ secrets.OPENAI_RSS_URLS }}
          COMMUNITY_RSS_URLS: ${{ secrets.COMMUNITY_RSS_URLS }}
        run: python predict.py

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build dashboard
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: predict
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
