name: WillTiboReset Prediction

on:
  workflow_dispatch:
  schedule:
    # 每 10 分钟运行一次
    - cron: '*/10 * * * *'

permissions:
  contents: write

jobs:
  predict:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update model state
        run: python update_model.py

      - name: Run prediction
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          TIBO_RSS_URLS: ${{ secrets.TIBO_RSS_URLS }}
          OPENAI_RSS_URLS: ${{ secrets.OPENAI_RSS_URLS }}
          COMMUNITY_RSS_URLS: ${{ secrets.COMMUNITY_RSS_URLS }}
        run: python predict.py

      - name: Commit prediction and model state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/prediction.json data/model_state.json
          git diff --staged --quiet || (
            git commit -m "chore: auto-prediction and model-state update"
            git pull --rebase
            git push
          )
