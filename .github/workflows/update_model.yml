name: Update Model State

on:
  workflow_dispatch:
  schedule:
    # Run daily at UTC 00:00
    - cron: '0 0 * * *'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout with full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update model state
        run: python update_model.py

      # Rebase before committing to survive race conditions when another
      # commit (e.g. from predict workflow) lands on main first.
      - name: Checkout main branch and rebase
        run: |
          git checkout main
          git pull --rebase --autostash origin main

      - name: Commit model state
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: auto-update model state"
          file_pattern: "data/model_state.json"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          skip_fetch: true